name: Florida certified credentials disposable packet

on:
  pull_request:
    paths:
      - 'artifacts/th-ea-fl-credentials/**'
      - 'scripts/th_ea_fl_credentials_stage.py'
      - 'scripts/th_ea_fl_credential_lookup.py'
      - '.github/workflows/fl-certified-credentials-disposable.yml'

jobs:
  credential-packet:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: credential_disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/credential_disposable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify frozen stage and exact credential lookup
        run: |
          python - <<'PY'
          import csv,hashlib,json
          from pathlib import Path
          from scripts.th_ea_fl_credential_lookup import lookup
          p=Path('artifacts/th-ea-fl-credentials/fl-certified-person-credentials.csv')
          m=json.loads(Path('artifacts/th-ea-fl-credentials/manifest.json').read_text())
          assert hashlib.sha256(p.read_bytes()).hexdigest()==m['stage_sha256']
          rows=list(csv.DictReader(p.open(encoding='utf8',newline='')))
          assert len(rows)==32560 and len({r['external_key'] for r in rows})==32560
          assert {(r['board_number'],r['occupation_code']) for r in rows if r['board_number']=='07'}=={('07','MRSA'),('07','MRSR')}
          for number,board in [('EF0000971','08'),('MRSA4','07'),('MRSR1','07'),('HI49','04')]:
              found=lookup(number)
              assert found and found['issuing_board']==board
              assert found['contractor_id'] is None and found['canonical_business'] is False
          assert lookup('MORALES, ALEJANDRO M') is None
          print('FROZEN_STAGE_AND_EXACT_LOOKUP=PASS')
          PY
      - name: Recreate credential schema and legacy board 06 sentinel
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f schema/initial_schema.sql >/dev/null
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO contractors(id,display_name)
          VALUES ('72dbf456-43c3-48ab-8616-11c7bc2106ad','Legacy board 06 business');
          INSERT INTO licenses(contractor_id,source_system,source_board,external_key,
            occupation_code,licensee_name_raw,board_number)
          VALUES ('72dbf456-43c3-48ab-8616-11c7bc2106ad','fl_dbpr','06',
            'CBC0000001','CBC','Legacy board 06 business','06');
          CREATE TABLE legacy_license_snapshot AS SELECT * FROM licenses;
          SQL
      - name: Two identical loads and first bounded rollback
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f artifacts/th-ea-fl-credentials/load.psql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE first_load_fingerprint AS
          SELECT md5(string_agg(id::text||':'||updated_at::text,',' ORDER BY id)) AS value
          FROM licenses WHERE board_number IN ('08','07','04') AND source_system='fl_dbpr';
          DO $$ BEGIN
            IF (SELECT count(*) FROM licenses WHERE board_number IN ('08','07','04')
                AND source_system='fl_dbpr' AND contractor_id IS NULL)<>32560
               OR (SELECT count(*) FROM licenses WHERE occupation_code='MRSA')<>3339
               OR (SELECT count(*) FROM licenses WHERE occupation_code='MRSR')<>3219
               OR (SELECT count(*) FROM contractors)<>1
            THEN RAISE EXCEPTION 'First credential load scope failed'; END IF;
          END $$;
          SQL
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f artifacts/th-ea-fl-credentials/load.psql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$ BEGIN
            IF (SELECT md5(string_agg(id::text||':'||updated_at::text,',' ORDER BY id))
                FROM licenses WHERE board_number IN ('08','07','04')
                  AND source_system='fl_dbpr') IS DISTINCT FROM
                (SELECT value FROM first_load_fingerprint)
            THEN RAISE EXCEPTION 'Identical credential rerun changed rows'; END IF;
          END $$;
          SQL
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f artifacts/th-ea-fl-credentials/rollback.psql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$ BEGIN
            IF (SELECT count(*) FROM licenses)<>1 OR (SELECT count(*) FROM contractors)<>1
              OR EXISTS (SELECT * FROM legacy_license_snapshot EXCEPT SELECT * FROM licenses)
              OR EXISTS (SELECT * FROM licenses EXCEPT SELECT * FROM legacy_license_snapshot)
            THEN RAISE EXCEPTION 'Rollback changed canonical business or board 06 sentinel'; END IF;
          END $$;
          SQL
      - name: Second load and rollback cycle
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f artifacts/th-ea-fl-credentials/load.psql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f artifacts/th-ea-fl-credentials/load.psql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f artifacts/th-ea-fl-credentials/rollback.psql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$ BEGIN
            IF (SELECT count(*) FROM licenses)<>1 OR (SELECT count(*) FROM contractors)<>1
              OR EXISTS (SELECT * FROM legacy_license_snapshot EXCEPT SELECT * FROM licenses)
              OR EXISTS (SELECT * FROM licenses EXCEPT SELECT * FROM legacy_license_snapshot)
            THEN RAISE EXCEPTION 'Second cycle failed to restore legacy baseline'; END IF;
          END $$;
          SQL
      - name: Conflicting native key fails closed
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO licenses(source_system,source_board,external_key,occupation_code,
            licensee_name_raw,board_number)
          VALUES ('fl_dbpr','06','EF0000971','CBC','Unrelated existing row','06');
          SQL
          if psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f artifacts/th-ea-fl-credentials/load.psql; then
            echo 'Conflicting native key was accepted'
            exit 1
          fi
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$ BEGIN
            IF (SELECT count(*) FROM licenses)<>2
              OR (SELECT count(*) FROM contractors)<>1
            THEN RAISE EXCEPTION 'Conflict attempt wrote unexpected rows'; END IF;
          END $$;
          DELETE FROM licenses WHERE external_key='EF0000971' AND source_board='06';
          SQL
